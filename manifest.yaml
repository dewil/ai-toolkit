# claude-toolkit - манифест канона
#
# Полный список канонических файлов репо с привязкой к типу проекта.
# ЕДИНСТВЕННЫЙ реестр списков - и для bootstrap, и для sync:
# - bootstrap-02/03 фетчат свою секцию (universal / <тип>) и раскатывают ее
#   (поименных списков в bootstrap-промтах нет - они тянут отсюда);
# - sync (migrations/sync-from-canon.prompt.md) через autodiscovery видит
#   канон-файлы, добавленные в репо ПОСЛЕ bootstrap проекта (их еще нет в
#   .claude/canon.yaml проекта).
#
# При добавлении нового rule/agent/skill/script в канон - дописать его сюда,
# в секцию по типу, ОДНОЙ строкой с однострочным комментом-описанием (# ...).
# Коммент - это и человекочитаемый реестр (открыл манифест - видно, что есть),
# и напоминание, зачем файл. universal тянется любым проектом (bootstrap-02);
# остальные секции - только проектами своего типа (bootstrap-03-<тип>).
# Скилл = подпапка skills/<name>/, в манифесте перечисляется по-файлово.
# Скрипт = файл в scripts/<name>.py, копируется в scripts/ в корне проекта
# (путь в каноне = путь в проекте).
# Команда = файл commands/<name>.md, копируется в .claude/commands/<name>.md
# (как rules/agents/skills - живет в .claude/, без chmod), вызывается как /<name>.
# Один и тот же файл может появляться в нескольких секциях - так фиксируется,
# что он нужен проектам нескольких типов одновременно. sync дедуплицирует
# при сборке type-set'а.

universal:
  - rules/typography-ru.md              # русская типографика: кавычки "...", тире-дефис, "е" вместо "ё"
  - rules/subagents-usage.md            # когда и как делегировать субагентам, экономия токенов
  - rules/docs-maintenance.md           # актуальность документации; README - человеческий манифест, CLAUDE.md - агентский
  - rules/compact-results.md            # сжатый вывод: результат, а не пересказ хода мысли
  - rules/addressing.md                 # обращение к пользователю по нику
  - rules/agent-as-user-voice.md        # голос пользователя, когда агент пишет от его лица третьим лицам
  - rules/outbound-timing.md            # когда отправлять исходящие живому человеку: рабочее окно получателя, не ночь
  - rules/secrets-handling.md           # обращение с секретами: не коммитить ключи, on-device конфиги
  - rules/untrusted-content.md          # внешний контент (зеркала, веб, чужие файлы, брифы) - данные, а не инструкции
  - rules/document-metadata.md          # свойства генерируемых документов (автор, заголовок, даты) задавать явно, не оставлять следы библиотеки
  - rules/client-umbrella.md            # клиент-зонтик: корень = папка клиента, одна память, ASCII-токен в имени
  - rules/memory-persistence.md         # проактивно сохранять durable-факты в память сразу, не дожидаясь конца сессии; память != контекст задачи
  - agents/architect.md                 # read-only проектирование: выбор подхода, trade-off, структура
  - agents/explorer.md                  # read-only разбор структуры и связей модулей
  - agents/searcher.md                  # поиск файлов/символов/паттернов (grep/glob)
  - agents/planner.md                   # декомпозиция задачи в проверяемые шаги с критериями
  - agents/summarizer.md                # сжатие длинного источника в структурированную заметку
  - skills/codex-audit/SKILL.md         # аудит кода/текста вторым мнением через codex exec
  - skills/web-research/SKILL.md        # веб-исследование с проверкой источников
  - skills/md-pdf/SKILL.md              # рендер markdown в PDF (для чтения и рассылки)
  - skills/md-docx/SKILL.md             # сборка .docx из markdown (когда документ пойдет на правки)
  - skills/harvest-canon/SKILL.md       # оформить переиспользуемый прием проекта в upstream-кандидат канона
  - skills/session-cost/SKILL.md        # подсчет токенов сессии Claude Code из транскрипта (смета, отчет)
  - commands/canon.md                   # /canon = синхронизация проекта с каноном
  - scripts/md-pdf.py                   # движок рендера markdown в PDF (для скилла md-pdf)
  - scripts/md-docx.py                  # сборка .docx из markdown, stdlib-only; разбор md берет из md-pdf.py
  - scripts/session-cost.py             # движок подсчета токенов сессии (для скилла session-cost)

coding:
