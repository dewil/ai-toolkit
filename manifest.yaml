# claude-toolkit - манифест канона
#
# Полный список канонических файлов репо с привязкой к типу проекта.
# Используется migrations/sync-from-canon.prompt.md для autodiscovery:
# sync фетчит этот файл и видит канон-файлы, добавленные в репо ПОСЛЕ
# bootstrap проекта (их еще нет в .claude/canon.yaml проекта).
#
# При добавлении нового rule/agent/skill/script в канон - дописать его сюда,
# в секцию по типу. universal тянется любым проектом (bootstrap-02);
# остальные секции - только проектами своего типа (bootstrap-03-<тип>).
# Скилл = подпапка skills/<name>/, в манифесте перечисляется по-файлово.
# Скрипт = файл в scripts/<name>.py, копируется в scripts/ в корне проекта
# (путь в каноне = путь в проекте).
# Один и тот же файл может появляться в нескольких секциях - так фиксируется,
# что он нужен проектам нескольких типов одновременно. sync дедуплицирует
# при сборке type-set'а.

universal:
  - rules/typography-ru.md
  - rules/subagents-usage.md
  - rules/docs-maintenance.md
  - agents/architect.md
