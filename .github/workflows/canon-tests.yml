name: Toolkit tests

# Полный набор тестов канонических скриптов и процедур Toolkit.
# Раскатываемые scripts/ остаются stdlib-only; проверка frontmatter в CI использует PyYAML.
#
# paths - маской по scripts/*.py, а не поименно: раскатываемые скрипты раньше
# в триггер не входили вовсе, и дефект в них доезжал до парка мимо CI.
#
# Каждый tests/test_*.py обнаруживается scripts/run-tests.py автоматически;
# отдельные процессы сохраняют изоляцию существующих модулей.

on:
  push:
    branches: [main]
    paths:
      - "scripts/*.py"
      - "tools/**"
      - "requirements-dev.txt"
      - "tests/test_*.py"
      - "manifest.yaml"
      - "bootstrap/**"
      - "templates/**"
      - "rules/**"
      - "agents/**"
      - "skills/**"
      - "commands/**"
      - "migrations/**"
      - "docs/**"
      - "README.md"
      - "CLAUDE.md"
      - "ARCHITECTURE.md"
      - "start.md"
      - "evals/**"
      - ".github/workflows/canon-tests.yml"
  pull_request:
    paths:
      - "scripts/*.py"
      - "tools/**"
      - "requirements-dev.txt"
      - "tests/test_*.py"
      - "manifest.yaml"
      - "bootstrap/**"
      - "templates/**"
      - "rules/**"
      - "agents/**"
      - "skills/**"
      - "commands/**"
      - "migrations/**"
      - "docs/**"
      - "README.md"
      - "CLAUDE.md"
      - "ARCHITECTURE.md"
      - "start.md"
      - "evals/**"
      - ".github/workflows/canon-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install developer dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: validate canon frontmatter
        run: python3 tools/check-frontmatter.py
      - name: byte-compile canon scripts
        # scripts/ копируются в проекты как есть - синтаксическая ошибка
        # не должна доезжать до парка
        run: python3 -m compileall -q scripts/
      - name: run tests
        run: python3 scripts/run-tests.py
