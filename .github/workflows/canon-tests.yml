name: canon-delta tests

# Прогон детерминированного дельта-движка канона (этап 8, часть a) плюс тесты
# канонических скриптов, которые раскатываются в проекты.
# stdlib-only, нужен только python3 + git (для git-fixture в build-lock/integration).
#
# paths - маской по scripts/*.py, а не поименно: раскатываемые скрипты раньше
# в триггер не входили вовсе, и дефект в них доезжал до парка мимо CI.
#
# Каждый tests/test_*.py обнаруживается scripts/run-tests.py автоматически;
# отдельные процессы сохраняют изоляцию существующих модулей.

on:
  push:
    branches: [main]
    paths:
      - "scripts/*.py"
      - "tests/test_*.py"
      - "manifest.yaml"
      - "bootstrap/**"
      - "templates/**"
      - "rules/**"
      - "agents/**"
      - "skills/**"
      - "commands/**"
      - "migrations/**"
      - "docs/**"
      - "README.md"
      - "CLAUDE.md"
      - "ARCHITECTURE.md"
      - "start.md"
      - "evals/**"
      - ".github/workflows/canon-tests.yml"
  pull_request:
    paths:
      - "scripts/*.py"
      - "tests/test_*.py"
      - "manifest.yaml"
      - "bootstrap/**"
      - "templates/**"
      - "rules/**"
      - "agents/**"
      - "skills/**"
      - "commands/**"
      - "migrations/**"
      - "docs/**"
      - "README.md"
      - "CLAUDE.md"
      - "ARCHITECTURE.md"
      - "start.md"
      - "evals/**"
      - ".github/workflows/canon-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: byte-compile canon scripts
        # scripts/ копируются в проекты как есть - синтаксическая ошибка
        # не должна доезжать до парка
        run: python3 -m compileall -q scripts/
      - name: run tests
        run: python3 scripts/run-tests.py
