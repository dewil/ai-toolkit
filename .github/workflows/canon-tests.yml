name: canon-delta tests

# Прогон детерминированного дельта-движка канона (этап 8, часть a) плюс тесты
# канонических скриптов, которые раскатываются в проекты.
# stdlib-only, нужен только python3 + git (для git-fixture в build-lock/integration).
#
# paths - маской по scripts/*.py, а не поименно: раскатываемые скрипты раньше
# в триггер не входили вовсе, и дефект в них доезжал до парка мимо CI.
#
# Список тестов ниже - поименный, и он уже расходился с tests/: chrome_cookies,
# gsheets и telegram_pace лежали в репозитории, но в CI не гонялись. Заводишь
# новый tests/test_*.py - дописывай его сюда же.

on:
  push:
    branches: [main]
    paths:
      - "scripts/*.py"
      - "tests/test_*.py"
      - "manifest.yaml"
      - "evals/**"
      - ".github/workflows/canon-tests.yml"
  pull_request:
    paths:
      - "scripts/*.py"
      - "tests/test_*.py"
      - "manifest.yaml"
      - "evals/**"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: byte-compile canon scripts
        # scripts/ копируются в проекты как есть - синтаксическая ошибка
        # не должна доезжать до парка
        run: python3 -m compileall -q scripts/
      - name: run tests
        run: |
          set -e
          for t in build_lock classify wal integration migrate fs_mapping md_pdf md_docx csv_xlsx md_pptx telegram_config mymeet_snapshot asana_comments asana_project asana_blockers run_evals feedback_collect chrome_cookies gsheets telegram_pace; do
            echo "::group::test_$t"
            python3 tests/test_$t.py
            echo "::endgroup::"
          done
